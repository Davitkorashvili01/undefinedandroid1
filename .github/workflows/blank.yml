name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            ls -la
            exit 1
          fi
          unzip -o "$ARCHIVE" -d extracted

      - name: Build APK
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: undefined-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
