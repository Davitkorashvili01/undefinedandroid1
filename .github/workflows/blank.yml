name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android SDK tools
        shell: bash
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$RUNNER_TEMP/tools-unpacked"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -o "$RUNNER_TEMP/tools.zip"

          unzip -q "$RUNNER_TEMP/tools.zip" -d "$RUNNER_TEMP/tools-unpacked"
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/tools-unpacked/cmdline-tools/." "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            ls -la
            exit 1
          fi

          unzip -o "$ARCHIVE" -d extracted

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: undefined-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
