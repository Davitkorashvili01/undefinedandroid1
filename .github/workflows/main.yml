
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
  run: yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found in repository root"
            ls -la
            exit 1
          fi
          unzip -o "$ARCHIVE" -d extracted

      - name: Build APK
        run: |
          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS"
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: undefined-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          
